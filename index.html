<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Live UK train and bus departures near you" />
  <title>UK Live Transit</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>UK Live Transit</h1>
    <button id="locateBtn" class="primary">📍 Near Me</button>
  </header>

  <main>
    <div id="status" class="status">Tap “Near Me” to find stops around you</div>

    <div id="map" class="map"></div>

    <section id="stopsSection" class="hidden">
      <h2>Nearby stops</h2>
      <div id="stopsList" class="stops-list"></div>
    </section>

    <section id="departuresSection" class="hidden">
      <div class="departures-header">
        <button id="backBtn" class="secondary">← Back</button>
        <h2 id="selectedStopName">Departures</h2>
      </div>
      <div id="departuresList" class="departures-list"></div>
    </section>
  </main>

  <footer>
    <small>Data via TransportAPI • Free personal use</small>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
