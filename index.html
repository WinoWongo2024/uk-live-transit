<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a0a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Live UK bus departures near you" />
  <title>UK Live Transit</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <div class="top-bar">
    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="Search stop or place…" autocomplete="off" enterkeyhint="search" />
      <button id="searchClear" class="search-clear hidden" type="button">×</button>
    </div>
    <div class="top-actions">
      <button id="favBtn" class="icon-btn" title="Favourites">★</button>
      <button id="locateBtn" class="icon-btn primary" title="My location">◎</button>
    </div>
  </div>

  <div id="searchResults" class="search-results hidden"></div>

  <div id="sheet" class="sheet">
    <div class="sheet-handle"></div>

    <div id="nearbyView">
      <div class="sheet-header">
        <h2>Nearby</h2>
        <span id="nearbyCount" class="badge">—</span>
      </div>
      <div id="status" class="status">Finding stops…</div>
      <div id="stopsList" class="card-list"></div>
    </div>

    <div id="departuresView" class="hidden">
      <div class="sheet-header">
        <button id="backBtn" class="back-btn">←</button>
        <div class="sheet-title-wrap">
          <h2 id="selectedStopName">Departures</h2>
          <div id="selectedStopMeta" class="meta"></div>
        </div>
        <button id="toggleFavBtn" class="icon-btn" title="Save favourite">☆</button>
      </div>
      <div id="departuresList" class="card-list"></div>
    </div>

    <div id="favouritesView" class="hidden">
      <div class="sheet-header">
        <button id="favBackBtn" class="back-btn">←</button>
        <h2>Favourites</h2>
      </div>
      <div id="favouritesList" class="card-list"></div>
      <div id="favEmpty" class="empty-state hidden">
        No favourites yet.<br>Tap ☆ on a stop to save it.
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
